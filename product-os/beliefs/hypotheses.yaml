# Living hypotheses. Update these as evidence arrives; do not add one per file.

hypotheses:
  - id: hyp-001
    title: The category bet is scoped objects + triggers, not agent UX
    statement: Knowledge-work products still constrain work (objects, access, approvals, steps) rather than offering open-ended autonomy. They do not share one abstraction. Notion puts scoped objects + triggers on a named agent. Viktor puts a brief on one employee. Zapier puts AI inside a trigger-action Zap and makes Copilot fill that canvas. Same category, three units.
    insight_ids:
      - ins-001
      - ins-005
    supporting_evidence_ids:
      - ev-agent-notion-001
      - ev-agent-notion-002
      - ev-agent-notion-003
      - ev-agent-viktor-001
      - ev-agent-zapier-001
    assumptions:
      - The first Zapier pass (a Zap, not an Agent) is the default path, not a detour
      - Custom-build (Notion) still used the same trigger / instructions / tools model
      - Viktor's Slack-proposed pipeline is the intended setup path, not a fallback
    what_would_strengthen:
      - (HubSpot skipped — no access)
      - A Zapier Agent that is still a workflow graph underneath
    what_would_falsify:
      - A common path that is mostly open-ended web/API autonomy with little product-object or step scaffolding
    status: proposed
    confidence: low-medium

  - id: hyp-002
    title: Slack "message posted" is not fire-on-every-message
    statement: Notion's Slack channel trigger does not fire on every public-channel post in practice. A plain post created no session; after Save, an @Notion AI mention produced a run, a database write, and a Read & Reply thread confirmation.
    insight_ids:
      - ins-002
    supporting_evidence_ids:
      - ev-agent-notion-002
    assumptions:
      - The first miss was missing @mention and/or unsaved settings, not the 36-hour Slack sync toast
    what_would_strengthen:
      - After Save, another unmentioned public-channel post still does not fire
      - Docs or UI that say Slack triggers require @Notion AI
    what_would_falsify:
      - After Save, a plain (no mention) public-channel post creates a session and a feedback row
    status: proposed
    confidence: low-medium

  - id: hyp-003
    title: Accountability for writes is not a first-class builder surface
    statement: Notion governs writes at connect-time (OAuth + toggles + optional Require confirmation) and governs interpretation in instructions. Help promises activity logs, version history, and reversible runs; the researcher could not find activity logs on these agents. Viktor gates Notion writes in Slack (Approve / Always approve). Post-hoc accountability is not first-class on either pass. Notion workspace AI analytics and the documented audit log are Enterprise; Viktor Usage was not opened.
    insight_ids:
      - ins-003
    supporting_evidence_ids:
      - ev-agent-notion-001
      - ev-agent-notion-002
      - ev-agent-notion-003
      - ev-agent-notion-004
      - ev-agent-notion-005
      - ev-agent-viktor-001
    assumptions:
      - Activity logs are not merely renamed to Recent chats / session steps
      - Viktor Always approve is a consent shortcut, not an audit log
    what_would_strengthen:
      - Version history also missing on the same agents
      - (HubSpot skipped — no access)
      - Zapier Zap history empty after publish; confirm whether live runs appear
      - Viktor Usage shows credits but not a per-write audit
    what_would_falsify:
      - An Activity tab (or equivalent) that is a real per-run log plus unsend on this plan
      - Viktor Usage (or Slack) exposing a reversible action log for Always-approved writes
    status: proposed
    confidence: medium

  - id: hyp-004
    title: Messaging-first setup trades speed for inspectability
    statement: If the primary place to configure a workflow is Slack/Teams chat (plan + Approve), operators get a fast "employee" install but lose streaming, loading, config knobs, and a saved spec they can inspect. A later session still showed Tasks at 0. Viktor named Customer Feedback Weekly Digest as active in the backend and called the empty portal a display bug, then said the Monday 9 AM job will run anyway. Sign-out and Calendar view also empty. Slack / the employee is the system of record. The portal is optional and can lie. Vertical templates stay thin because chat is a bad surface for schema work.
    insight_ids:
      - ins-004
    supporting_evidence_ids:
      - ev-agent-viktor-001
      - ev-agent-viktor-003
    assumptions:
      - The Slack proposal + Approve path is the intended custom-task setup, not a fallback
      - Viktor's "display bug" claim is at least directionally right that something exists off-portal
    what_would_strengthen:
      - Monday 9 AM delivers (or does not). Either way the portal was not the truth. Sign-out and Calendar already failed.
    what_would_falsify:
      - Slack-created work reliably appears on Tasks with steps, scopes, test, retry
      - Slack setup itself streams progress and exposes config knobs
      - (Zapier already puts setup on a canvas; that strengthens the contrast, it does not falsify Viktor)
    status: proposed
    confidence: medium

  - id: hyp-005
    title: XeroForce has to pick a point on define-vs-delegate, not a feature set
    statement: If XeroForce copies Zapier, users keep high workflow control and AI lives in selected steps. If it copies Notion, users configure a persistent agent without drawing the full graph. If it copies Viktor, users delegate the outcome and give up an explicit plan. Accounting work that is really a pipeline leans Zapier. Work that needs a named, scoped specialist leans Notion. Work that is "just get it done" leans Viktor and is the weakest to govern. The Zapier first pass published a Zap, not an Agent. The Viktor pass never showed a task editor.
    insight_ids:
      - ins-005
    supporting_evidence_ids:
      - ev-agent-notion-001
      - ev-agent-notion-003
      - ev-agent-notion-004
      - ev-agent-viktor-001
      - ev-agent-viktor-002
      - ev-agent-viktor-003
      - ev-agent-zapier-001
    assumptions:
      - The missing Viktor editor is not hiding a Notion-like Settings object
      - Zapier's default path is Zap+Copilot, not the Agents product
      - Accounting operators will want named ownership of high-risk workflows
    what_would_strengthen:
      - (HubSpot skipped — no access)
      - A Zapier Agent that is still a Zap graph underneath
      - A Xero workflow (e.g. invoice exception) that is unsafe to leave as "Viktor figures out the steps"
    what_would_falsify:
      - Tasks list showing the digest with a Settings-like editor
      - A Zapier Agent that is a true persistent agent (not a Zap) and is the default create path
      - A later product that is agent + employee + workflow with no real tradeoff
    status: proposed
    confidence: low-medium

  - id: hyp-006
    title: Zapier will not replace the workflow graph with an agent
    statement: Zapier believes users still want an explicit workflow graph. AI should make selected parts of that graph adaptive or autonomous, not retire Trigger → Action. Copilot, AI by Zapier, Human in the Loop, and even the Agents tour all sit on top of steps, tests, and publish. If that bet is right, XeroForce should keep a visible pipeline and put models inside steps. If it is wrong, the graph becomes legacy chrome and the Agents product (or something like Viktor) eats the default path.
    insight_ids:
      - ins-005
    supporting_evidence_ids:
      - ev-agent-zapier-001
    assumptions:
      - The first published Zap is the intended default, not a fallback from a failed Agent create
      - "AI teammates" marketing does not already mean the graph is being deprecated
    what_would_strengthen:
      - A Zapier Agent that is still a step graph underneath (trigger, AI step, actions, test, publish)
      - HITL as another step in the same graph, not a different object
      - Other products keeping canvas-plus-AI-step rather than employee-in-chat
    what_would_falsify:
      - Default create path is an Agent with no Trigger → Action canvas
      - Copilot shipping a black-box employee that hides steps after publish
    status: proposed
    confidence: low-medium

  - id: hyp-007
    title: Digits is the more dangerous competitor because it replaces the GL, not just the workflow
    statement: "Karbon/Aider adds AI on top of Xero (or QBO). That is a workflow-layer threat: firms might do period close and advisory in Karbon, not Xero. But the GL stays. Digits replaces the GL entirely with an agentic system — if a firm migrates to Digits, Xero loses the system of record. An agentic GL that auto-books 95%+ of transactions makes the traditional categorize-then-reconcile GL feel manual. XeroForce defending the GL may matter more than XeroForce adding workflow features."
    insight_ids:
      - ins-006
    supporting_evidence_ids:
      - ev-comp-digits-001
      - ev-comp-digits-002
      - ev-comp-digits-003
      - ev-comp-aider-001
    what_would_strengthen:
      - Hands-on Digits trial confirms 95%+ auto-booking in practice
      - SMB firms citing Digits as reason to leave Xero
      - Digits for Firms growing adoption among Xero partner firms
    what_would_falsify:
      - Digits auto-booking accuracy much lower in practice than claimed
      - SMBs unwilling to leave their GL (switching cost too high)
      - Xero ships agentic categorization/reconciliation that matches Digits
    status: proposed
    confidence: low-medium

  - id: hyp-008
    title: The competitor trust model is ahead of the agent-builder trust model
    statement: "Digits ships embedded verification (two AI layers in the same system of record) and manage-by-exception UX. Karbon ships approve/edit/reject with audit trail via Agent Management System. Both are more concrete than Notion's missing activity logs, Viktor's empty portal, or Zapier's optional HITL step. If XeroForce copies agent-builder trust patterns instead of competitor trust patterns, it will underdeliver on accountability for financial writes."
    insight_ids:
      - ins-003
      - ins-006
      - ins-007
    supporting_evidence_ids:
      - ev-comp-digits-001
      - ev-comp-aider-001
      - ev-comp-aider-003
      - ev-agent-notion-005
      - ev-agent-viktor-003
    what_would_strengthen:
      - Hands-on Digits exception inbox shows rich context for reviewer
      - Karbon Agent Management System audit trail is detailed and usable
    what_would_falsify:
      - Digits verification layer is cosmetic — errors slip through at similar rates
      - Karbon audit trail is shallow or hard to use in practice
    status: proposed
    confidence: low

  - id: hyp-009
    title: If XeroForce stays on agentic ledger workflows, Karbon takes the rest of the client lifecycle
    statement: "Karbon's role list is a scope claim — Bookkeeper (workpapers, reconcile, client follow-up), Tax Admin (returns, compliance, summaries), Fractional CFO (forecasts, what-ifs, client-ready reports), Onboarding Specialist (collect, validate, configure). Aider's acquisition list adds management reports and advisory dashboards. XeroForce focusing on agentic workflows inside the GL leaves reports, onboarding, tax ops, and billing as Karbon's default. Accounting being workflow-defined makes that land-grab cheaper for Karbon than it would be in an MSP-like industry."
    insight_ids:
      - ins-006
      - ins-009
      - ins-010
    supporting_evidence_ids:
      - ev-comp-aider-002
      - ev-comp-aider-001
    what_would_strengthen:
      - XeroForce brief that names ledger workflows and omits reports / onboarding / tax
      - Firms using Karbon for reports and client ops while keeping Xero as GL
    what_would_falsify:
      - XeroForce scope already includes client reports and full-lifecycle ops
      - Karbon Agents stay vaporware and firms do lifecycle work in Xero
    status: proposed
    confidence: low

  - id: hyp-010
    title: Role agents work in accounting because the jobs are shared; they would fail in MSP-like variance
    statement: "Aider can ship one Monthly Close - Accrual template onto 82 clients because close work is shared enough to teach as workflow-plus-tool. MSP training that only sells the tool, with high workflow variance, cannot do that. Whether Karbon can also ship Bookkeeper / Tax Admin / fCFO as named teammates is a separate, untested claim — we have not seen Agents. If the shared-job bet is right, XeroForce can be opinionated about close. If it is wrong, firms will reject templates the way MSPs reject one-size playbooks."
    insight_ids:
      - ins-005
      - ins-009
      - ins-010
    supporting_evidence_ids:
      - ev-comp-aider-002
      - ev-comp-aider-003
    what_would_strengthen:
      - Customer evidence that close / onboarding steps look the same across firms
      - More templates beyond Monthly Close - Accrual applied at similar scale
    what_would_falsify:
      - Firms needing heavily custom close that a shared template cannot absorb
      - Hands-on Karbon Agents (still unseen) that require each firm to specify the whole job
    status: proposed
    confidence: low

  - id: hyp-011
    title: Continuous close may create work the way more-frequent MSP scans do — verify with users
    statement: "Digits now distinguishes fast month-end (automate the sprint; still a sprint) from continuous close (rebuild the GL; no backlog). They say bolt-on AI on Xero cannot do the second because of truth drift. Their own 'stay traditional if' list matches the MSP-scan cut: <5 clients, clients not asking for current reporting, monthly cadence still fits. Alternative still open: even for larger books, a mid-month exception drip can be more work than one automated close if nobody uses Tuesday-afternoon numbers. If that is right, XeroForce can ship a faster month-end on Xero and cover most of the market Digits concedes. If clients are asking for current numbers and week-one cleanup is the burnout, a smarter sprint will not be enough. Sharper framing than 'do they want it': continuous close is a *behaviour migration*, not a feature. The firm has to move from batch review to continuous exception handling, which changes staffing, scheduling, and what clients expect — which is why Digits had to rebuild the ledger, and also why a firm might decline even if the technology works. So the question is whether firms are willing to change behaviour, and whether adoption needs an explicit incentive to happen at all."
    insight_ids:
      - ins-011
      - ins-006
    supporting_evidence_ids:
      - ev-comp-digits-004
      - ev-comp-digits-003
      - ev-comp-digits-002
      - ev-comp-digits-001
    what_would_strengthen:
      - Accountants who ignore intra-month flags or say flags create extra review
      - SMBs / firms who only need books at month-end, tax, or lender ask
      - Firms with >5 clients who still prefer a batch close
      - Firms who say the staffing/scheduling change is the blocker, not the technology
    what_would_falsify:
      - Firms citing always-current cash/P&L as why they left Xero
      - Continuous inbox that is quieter than Xero's month-end queue
      - Clients actually requesting treated numbers mid-period (the Stripe Tuesday story)
      - Firms who migrated cadence without any incentive beyond the software
    status: proposed
    confidence: low

  - id: hyp-012
    title: Accounting adopts agents faster than engineering because the work is checkable — unless error cost dominates
    statement: "Verifiability, not absence of judgment, is what distinguishes accounting from engineering here. A categorisation can be graded against firm history, prior decisions, and a ledger that must balance; a software design decision cannot. That is why a verification layer is buildable in accounting and largely is not in engineering, and it predicts higher adoption. Against that, consequence severity raises the confidence threshold required before anyone lets an agent act: a bad commit is reverted in review, a bad posting may need a restatement and has statutory exposure. So the prediction is conditional — accounting adopts faster where errors are cheap to correct (coding, categorisation, reconciliation) and slower where they are not (anything filed, remitted, or reported externally), rather than faster or slower overall. Note this is not the same claim as 'accounting needs little judgment', which Digits' own 10.4% human-versus-human disagreement contradicts."
    insight_ids:
      - ins-014
      - ins-013
      - ins-006
    supporting_evidence_ids:
      - ev-comp-digits-002
      - ev-comp-digits-001
      - ev-comp-aider-003
    assumptions:
      - Digits' reported human disagreement rate is representative, not an artefact of their sample
      - Firms distinguish reversible postings from filed/remitted outputs when deciding what to automate
    what_would_strengthen:
      - Accountants who accept automation on coding but not on anything filed
      - Firms who say they trust an automated check more than a junior reviewer
      - Adoption concentrated in reversible steps of the close
    what_would_falsify:
      - Blanket refusal to automate regardless of reversibility (then trust, not error cost, is the barrier)
      - Firms automating filings readily (then consequence severity is not the brake)
      - Accounting adoption no higher than engineering despite verifiability
    status: proposed
    confidence: low
