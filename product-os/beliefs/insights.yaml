  - id: ins-008
    title: Integration runs two directions — hosting other tools vs being a tool inside someone else's agent
    statement: "Every product here integrates other tools *inbound*, and every product can also be integrated *outbound* as a capability inside another workflow builder or agent. Those are different strategies and get collapsed into one 'ecosystem' bullet. Zapier, Karbon, and Digits all ship or announce MCP servers — Digits' is live for Claude, ChatGPT and Cursor; Karbon announced one in June 2026. Zapier is deliberately both: a host with a canvas, and a positioned tool layer for external agents."
    why_it_matters: "Two questions, and the second is usually asked first. (1) Does Xero host — does work happen on our surface, competing with Zapier and Karbon for that position? (2) Is Xero callable — can an agent elsewhere use Xero as a capability? Being callable is not free: the reasoning, the UI, and the customer relationship all move to the caller, and Xero becomes a commodity capability. But refusing to be callable means firms route Xero data through competitors that allow it. MCP is the mechanism once the surface-vs-capability question is answered, not a substitute for answering it. Zapier's hedge — be both — is the option worth studying."
    status: emerging
    confidence: low
    products: []
    domains:
      - competitor
      - agent_builder
    supporting_evidence_ids:
      - ev-comp-aider-001
      - ev-comp-digits-001
