  - id: ins-012
    title: AI plays two roles — it builds the workflow and it runs inside the workflow
    statement: "These are separate products with separate trust profiles, and the same vendor ships both. Build-time: Zapier's Copilot interrogates the user with clarifying questions and then constructs the Zap; Notion generates an agent from a description, which the user then edits. Runtime: AI by Zapier as a step in the published graph; the Notion agent executing against its instructions. The seam is visible where build-time AI is incomplete — Zapier's Copilot could say what instructions belonged in a step but sometimes required manual copy/paste rather than applying them itself. Viktor collapsed the two into one chat, which is the better explanation of why nothing was inspectable: the build-time output (a spec) was never materialised as an artifact, so there was no object to edit, test, or audit."
    why_it_matters: "A wrong build-time suggestion is caught by a human before publish. A wrong runtime action posts to the ledger. So the two need different governance, and build-time AI is the cheaper place to be aggressive — it can be confidently wrong at low cost, provided it produces a reviewable artifact. XeroForce should decide explicitly whether it is shipping AI that builds close workflows, AI that runs inside them, or both, rather than letting 'AI-powered' cover both. The Viktor failure mode is the one to avoid: if build-time AI produces no artifact, the product loses inspectability, testing, and audit in one move."
    status: emerging
    confidence: low-medium
    products:
      - notion
      - viktor
      - zapier
    domains:
      - agent_builder
    supporting_evidence_ids:
      - ev-agent-zapier-001
      - ev-agent-notion-001
      - ev-agent-notion-003
      - ev-agent-viktor-001
      - ev-agent-viktor-003
    counter_evidence_ids: []
    next_evidence:
      - Does a Zapier Agent produce a build-time artifact, or is it chat-only?
      - Notion — can the generated agent config be diffed or versioned after edit?
      - Whether any product tests the build-time output before publish

  - id: ins-013
    title: Safety is three separate gaps — audit, rollback, and gating — and gating is the one nobody made intelligent
    statement: "Do not collapse these. (a) Auditability: what happened. Zapier has Zap history as a first-class page; Notion advertises activity logs that were not on this workspace; Viktor showed 0 tasks while claiming a live backend job. (b) Reversibility: undo it. Not present on any of the three — no unsend in Notion, no rollback observed anywhere. (c) Gating: when to involve a human. All three treat this as *static configuration* — a 'Require confirmation before email' toggle, an optional Human-in-the-Loop step, a Slack Approve / Always approve button. None decides dynamically from confidence, risk, or amount. Both competitors claim the opposite: Digits routes low-confidence items to an exception queue, Karbon's checks flag and humans resolve (`CLAIMED`, neither verified)."
    why_it_matters: "Statically-configured gating cannot work for ledger writes, because a $40 coding and a $120k journal entry cannot share one toggle. Risk-triggered gating is the thing to build, and it is the specific place where the accounting competitors are ahead of the agent builders rather than merely different. Reversibility is the second-order requirement and is absent across the whole category — for financial writes it is arguably harder and more valuable than audit, since audit tells an operator what went wrong and rollback lets them fix it. Treat the three as three roadmap items, not one 'trust and safety' bucket."
    status: emerging
    confidence: medium
    products:
      - notion
      - viktor
      - zapier
    domains:
      - agent_builder
      - competitor
    supporting_evidence_ids:
      - ev-agent-notion-003
