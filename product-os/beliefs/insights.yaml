insights:
  - id: ins-001
    title: These products ship automation, not free-form autonomy — but they disagree on where the agent lives
    statement: Notion, Viktor, and Zapier all sell configured automation, not an open-ended autonomous worker. They disagree on the home surface. Notion keeps a builder inside the host product. Viktor frames an AI employee whose workplace is Slack/Teams; the portal does not stay in sync. Zapier keeps a workflow canvas in-product (Copilot beside Trigger → Action). Agents marketing lives on a separate tour; the first published object was still a Zap on that canvas.
    why_it_matters: XeroForce has to pick a home — in-product builder vs messaging coworker vs workflow canvas. That choice drives setup visibility, who can configure, and whether accounting objects stay first-class.
