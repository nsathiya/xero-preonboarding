  - id: ins-011
    title: Continuous close is Digits' cadence bet — not yet a verified customer want
    statement: "Digits built a GL from the ground up. Architecture bet (whitepaper): specialized AGL beats LLM / LLM-harness on categorization accuracy, latency, and cost — on Digits' own data. Cadence bet (blog + vs-Xero page): categorize / rec / verify as txns arrive so month-end is review, not a cleanup sprint. Digits themselves split 'fast month-end' (Xero + AI; sprint shrinks, still exists) from 'continuous close' (rebuild the ledger; sprint gone). Stated user value: client sees treated numbers the day activity happens (Stripe Tuesday example); firm week-one becomes advisory; exceptions while context is fresh; capacity scales with judgment not volume; firm knowledge stays in models. They also say stay on month-end if <5 clients, clients are not asking for current reporting, or monthly cadence still fits. Unverified with customers. Researcher MSP parallel still stands. Benchmark numbers on the blog (17,792 txns, LLMs <73%) do not match the whitepaper on file (2,000 txns, top LLM 86.8%) — same paper title, different result."
    why_it_matters: XeroForce can ship a faster month-end on Xero without accepting Digits' cadence. Digits says that is a different, inferior product (truth drift, leftover sprint). That is their architecture claim. Whether users want Tuesday-afternoon books — or would find a mid-month inbox more work — is still a customer question. Digits' own 'stay traditional if' list is the cut to test.
    status: emerging
    confidence: low
    products: []
    domains:
