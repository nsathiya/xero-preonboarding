  - id: ins-007
    title: "Shipped vs marketed" is a reliable signal — the more specific the claim, the more likely it is real
    statement: "Across both agent builders and competitors, there is a consistent gap between what is marketed and what has been observed. Notion markets activity logs (missing), Viktor markets a live task (portal empty). Karbon markets AI Agents and Kai; what we have seen is Aider period-close rules, which are not those agents. Digits markets 'Agentic GL' and has shipped auto-booking — its claims are specific (95%+, 97.8% accuracy, $875B training data) and closer to verifiable. Pattern: vague 'AI agent' framing with role metaphors (employee, coworker, teammate) is easy to over-read. Specific, quantified claims about what the software does tend to be closer to reality. Do not treat a rules/checklist product as proof of an agent model."
    why_it_matters: For XeroForce, this means do not copy competitor marketing language into product requirements. Ground every claim in shipped, observable behavior. And when evaluating threats, weight shipped capability over announced roadmap.
