  - id: ins-004
    title: Slack is a fast install surface and a weak workflow builder
    statement: Viktor's onboarding is Slack-first (signup, channel invite, "Now go to Slack," custom tasks via "Ask Viktor in Slack"). Templates are mostly generic productivity (briefings, meetings, email), not Notion-like verticals. A web checklist and Academy videos exist, but configuration of a real pipeline happened in Slack with Approve buttons and little streaming, loading, or config knobs. A later session still could not open a task editor. Tasks showed 0. Viktor said Customer Feedback Weekly Digest exists, is active in the backend, and called the empty portal a display bug, then said the Monday 9 AM digest will run anyway. Sign-out and Calendar view also failed. Two surfaces, no shared system of record. The employee is also the support desk.
    why_it_matters: Messaging-first can get an "employee" live in minutes, but accounting workflows need inspectable setup (steps, scopes, test) on the same surface operators will return to. If Slack can claim a live backend job while the portal stays empty, operators cannot tell what is actually live and cannot edit it except by chatting.
    status: emerging
    confidence: medium
    products:
      - viktor
    domains:
      - agent_builder
    supporting_evidence_ids:
      - ev-agent-viktor-001
      - ev-agent-viktor-003
    counter_evidence_ids: []
    next_evidence:
      - Does the Monday 9 AM digest actually arrive?
      - After a real Slack push, does Zapier Zap history show the run?

  - id: ins-005
    title: The split is how much of the execution plan the user defines vs delegates
    statement: "The key difference across Zapier, Notion, and Viktor is how much of the execution plan the user defines versus delegates to the agent. Zapier is high-control / low-autonomy — the user owns an explicit workflow graph (steps, inputs/outputs, test, publish); AI or agentic steps run inside it. Viktor is high-autonomy / low-workflow-control — the user delegates an outcome; Viktor decides more of the path; the workflow is less visible and less configurable (this pass never produced an inspectable portal object). Notion sits in the middle — a persistent agent with instructions, context, tools, triggers, and permissions, but not a Zapier-style step graph. Primary abstractions, left to right: Workflow → Agent → AI employee. Feature checklists matter less than this. Hands-on: Zapier published Slack Feedback → AI Triage Analysis → Email v1 (AI by Zapier as a step); Notion published Customer Feedback Triage Agent; Viktor took a Slack brief and never showed a task editor."
    why_it_matters: XeroForce is picking a point on this line, not a model vendor. High workflow control is inspectable and closer to existing automation. High autonomy is faster to start and harder to govern. The middle (named agent, no full graph) is a real third product, not a compromise UI. Karbon's Agents article sits with Viktor (firm roles) — that is marketing only; the Agents product has not been seen. HubSpot skipped.
    status: emerging
    confidence: low-medium
