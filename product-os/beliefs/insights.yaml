  - id: ins-006
    title: Competitors split into GL-replacement vs practice-layer — XeroForce must know which fight it is in
    statement: "Digits replaces the general ledger itself with an agentic system that auto-books 95%+ of transactions using custom-trained ML (not LLMs) on $875B in real SMB data. The user does not configure or name an agent; the ledger IS the agent. Karbon/Aider sits on top of existing GLs. Seen in an Aider tutorial: Period Close Dashboard (client × period, Pass/red counts), a firm template (Monthly Close - Accrual) on 82 clients, Built-in and Automatic-N-conditions checks, exception inbox, Ask Client batched end of day. Those are rules and a close workflow — not evidence of how Karbon AI Agents work. Agents (Bookkeeper, Tax Admin, fCFO, Onboarding) are marketed as roles and listed as early beta / 2026; no Agents tutorial or product pass yet. Different layers: Digits threatens Xero the product; Karbon threatens the portfolio-close and (if Agents ship) client-lifecycle layer."
    why_it_matters: XeroForce has to answer whether it is defending the GL (against Digits) or covering the full client lifecycle Karbon is claiming (reports, onboarding, tax, advisory, billing) — or both. Staying on 'agentic workflows' only concedes the rest of the firm to Karbon.
