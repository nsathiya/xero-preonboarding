  - id: ins-014
    title: Accounting is more verifiable than engineering, not less judgment-heavy — verifiability is what makes trust buildable
    statement: "The tempting read of Digits' 95%+ auto-post rate is that accounting is rules-based and needs little judgment. Digits' own whitepaper contradicts it: 10.4% human-versus-human disagreement on categorisation and a 79.1% human baseline. Two accountants shown the same transaction disagree roughly one time in ten, which is a judgment ceiling, not a rulebook. The distinction that survives is verifiability — a categorisation can be checked against firm history, prior decisions, and a ledger that must balance. That is what lets Digits run a second AI layer verifying the first *before* posting; engineering has no equivalent grader, since tests catch some errors and no design errors."
    why_it_matters: "This reframes the adoption question. Trust is the outcome; demonstrable verification is the mechanism that produces it — so the thing to build is the checking layer, not more model quality. But the adoption equation has two terms pulling opposite ways: verifiability raises the ceiling, and consequence severity raises the confidence threshold required to act. A bad commit is reverted in review; a bad posting has tax and audit consequences and may need a restatement. Whether accounting therefore adopts faster than engineering is genuinely open, and it is a customer question rather than a desk-research one."
    status: emerging
    confidence: low
    products: []
    domains:
      - competitor
      - customer
      - product_knowledge
    supporting_evidence_ids:
      - ev-comp-digits-002
      - ev-comp-digits-001
      - ev-comp-digits-004
      - ev-comp-aider-003
    counter_evidence_ids: []
    next_evidence:
      - Where accountants say judgment genuinely dominates and no check would settle it
      - Whether firms trust an automated verification layer more than a human reviewer
      - The real error cost of a wrong posting — corrected quietly, or a restatement?
      - Adoption rates for AI in accounting vs engineering, and the reason given
