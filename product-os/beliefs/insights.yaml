  - id: ins-008
    title: MCP-as-platform is an industry convergence — accounting data as tools for external AI
    statement: "Zapier, Karbon, and Digits all ship or announce MCP servers. The pattern: expose accounting/practice data to Claude, ChatGPT, Cursor, and other AI clients. This means firms will expect to plug their accounting data into whatever AI tools they choose, not only the vendor's own AI. Zapier also positions as a tool layer for external agents (not just its own Agents/Zaps)."
    why_it_matters: If XeroForce does not ship an MCP server (or equivalent open tool layer), firms will route Xero data through competitors that do. The value shifts from 'our AI is best' to 'our data is accessible to any AI.'
