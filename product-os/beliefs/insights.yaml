  - id: ins-009
    title: Karbon's Agents are marketed as roles; we have not seen the Agents product
    statement: "Karbon's AI Agents article sells Viktor-like firm roles (Bookkeeper, Tax Admin, Fractional CFO, Onboarding Specialist) — capabilities mapped to jobs that already exist, split into Service Delivery vs Service Management. That is marketing copy only. The Aider tutorial we have is period close: portfolio dashboard, firm checklist, Built-in / Automatic-N-conditions checks, Ask Client. Those are rules. Rules are not agents, and that tutorial is not evidence of how Agents work. Do not conclude Agents are workflow-based, role-based, or anything else until there is an Agents tutorial or hands-on pass."
    why_it_matters: Mixing Aider's close rules with Karbon's Agents marketing will make XeroForce copy the wrong object. Period close is a real, opinionated product. Agents are a separate, unseen bet. Place them on the define-vs-delegate line only after seeing them.
