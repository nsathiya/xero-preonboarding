  - id: ins-004
    title: Slack is a fast install surface and a weak workflow builder
    statement: Viktor's onboarding is Slack-first (signup, channel invite, "Now go to Slack," custom tasks via "Ask Viktor in Slack"). Templates are mostly generic productivity (briefings, meetings, email), not Notion-like verticals. A web checklist and Academy videos exist, but configuration of a real pipeline happened in Slack with Approve buttons and little streaming, loading, or config knobs. A later session still could not open a task editor. Tasks showed 0. Viktor said Customer Feedback Weekly Digest exists, is active in the backend, and called the empty portal a display bug, then said the Monday 9 AM digest will run anyway. Sign-out and Calendar view also failed. Two surfaces, no shared system of record. The employee is also the support desk.
    why_it_matters: Messaging-first can get an "employee" live in minutes, but accounting workflows need inspectable setup (steps, scopes, test) on the same surface operators will return to. If Slack can claim a live backend job while the portal stays empty, operators cannot tell what is actually live and cannot edit it except by chatting.
    status: emerging
    confidence: medium
    products:
