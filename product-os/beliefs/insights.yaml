  - id: ins-005
    title: Compare what the user creates — workflow, agent, or task — and the count of them
    statement: "The useful comparison is the object the user actually creates: Zapier a workflow, Notion an agent, Viktor a task. Compare created objects to created objects, not to marketing personas. Viktor's 'AI employee' is the persona; the employee is singular and pre-existing, so the thing the user makes is a task assigned to it. The count is the discriminator — Notion creates many named agents (one per job or vertical), Viktor has one employee and many tasks, Zapier has many workflows and no agent object at all. That maps onto how much of the execution plan the user specifies. Zapier is high-control / low-autonomy: an explicit graph (steps, inputs/outputs, test, publish) with AI inside a step. Viktor is high-autonomy / low-control: delegate an outcome, and the plan is neither visible nor editable — there was no task editor because the task was never materialised outside Slack. Notion is a real middle: a persistent agent with instructions, context, tools, triggers, and permissions, but no step graph. Left to right: Workflow → Agent → Task. Hands-on: Zapier published Slack Feedback → AI Triage Analysis → Email v1; Notion published Customer Feedback Triage Agent; Viktor took a Slack brief and produced nothing inspectable."
    why_it_matters: XeroForce is picking a point on this line, not a model vendor. High workflow control is inspectable and closer to existing automation. High autonomy is faster to start and harder to govern. The middle (named agent, no full graph) is a real third product, not a compromise UI. The object choice also fixes the governance unit — permissions, audit, and ownership attach to whatever the user creates, so 'one employee, many tasks' and 'many scoped agents' have different governance ceilings before a single feature is built. Karbon's Agents marketing sits near Viktor; the Agents product has not been seen. HubSpot skipped.
    status: emerging
    confidence: low-medium
    products:
