  - id: ins-010
    title: Accounting work is workflow-defined; that is why role agents and tutorial-plus-tool content both fit
    statement: "Aider's tutorial names a standard close problem (managers have no single view of client close; status lives in meetings and memory; same issue at 15 or 15,000 clients), then shows the tool: portfolio dashboard, one Monthly Close - Accrual template applied to 82 clients, Built-in/Automatic checks, exception inbox, Ask Client batched to end of day. Workflow and tool are taught together. That only works if the close is shared enough to template. Contrast with MSPs, where vendors sell tools and workflows vary — a known industry problem. The 40 hours/employee/month figure remains a Karbon CEO research claim, not a measured Aider outcome; 19.9 hrs/week is a separate Karbon PM number."
    why_it_matters: XeroForce can assume more shared close workflow than an MSP product can — that is why one accrual template can sit on 82 clients. That does not decide the Agents model. It does mean opinionated close checklists are viable here. Client reports and full-lifecycle ops are a separate scope question, not proven by this tutorial.
    status: emerging
    confidence: low-medium
    products: []
    domains:
