  - id: ins-002
    title: Connected is not the same as live
    statement: Connecting Slack (or Mail) and toggling a trigger does not mean the agent is watching. A plain Slack post did nothing while settings were unsaved; after Save plus an @Notion AI mention, the same feedback was captured, written to a database, and confirmed in-thread. Save is also a hard gate ("Agent won't run until you save").
    why_it_matters: Accounting agents will need the same split — consent vs action scope vs trigger activation — plus a clear "this run happened / this row was written" signal. Users will otherwise assume connected equals live.
    status: emerging
    confidence: low-medium
    products:
      - notion
    domains:
      - agent_builder
    supporting_evidence_ids:
      - ev-agent-notion-001
      - ev-agent-notion-002
      - ev-agent-notion-003
    counter_evidence_ids: []
    next_evidence:
