  - id: ins-002
    title: Connected is not the same as live
    statement: Connecting Slack (or Mail) and toggling a trigger does not mean the agent is watching. A plain Slack post did nothing while settings were unsaved; after Save plus an @Notion AI mention, the same feedback was captured, written to a database, and confirmed in-thread. Save is also a hard gate ("Agent won't run until you save").
    why_it_matters: Accounting agents will need the same split — consent vs action scope vs trigger activation — plus a clear "this run happened / this row was written" signal. Users will otherwise assume connected equals live.
    status: emerging
    confidence: low-medium
    products:
      - notion
    domains:
      - agent_builder
    supporting_evidence_ids:
      - ev-agent-notion-001
      - ev-agent-notion-002
      - ev-agent-notion-003
    counter_evidence_ids: []
    next_evidence:
      - Isolate Save vs @mention on Slack (plain post after Save)
      - Compare Slack vs Calendar/GitHub trigger activation
      - Whether Mail send also requires Save before HITL appears
      - Viktor "Always approve" vs Notion Save / @mention as two "not live yet" patterns

  - id: ins-003
    title: Writes get HITL; interpretation gets a prompt; audit is thin
    statement: Notion puts quality rules in the instructions box (taxonomy, Guardrails) and write safety in product controls (OAuth, dropdowns, Require confirmation before email). Viktor also gates Notion writes with Slack Approve / Always approve. Help Center sells Custom Agents as "Safe & transparent" — activity logs, version history, reviewable and reversible runs — and puts workspace audit-log changes behind Enterprise. On this workspace the researcher looked for activity logs and they were not there. What exists is a current-run step trace, Recent chats, and an Analytics page that upsells Enterprise. No first-class send audit or unsend. Zapier treats HITL as an optional step after AI by Zapier ("review the output before your Zap continues") and has Zap history as a first-class page — empty immediately after publish. Viktor Usage was not opened.
    why_it_matters: For XeroForce, HITL before an outbound or financial write is the right pattern. Prompt guardrails are not enough. Do not copy Notion's help copy. If activity logs are advertised and missing, operators will think they have an audit trail they do not. Gating real visibility behind Enterprise is worse when the action touches money or customers.
    status: emerging
    confidence: medium
    products:
      - notion
      - viktor
      - zapier
    domains:
      - agent_builder
    supporting_evidence_ids:
