[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "product-os"
version = "0.1.0"
description = "Local evidence-first learning harness (V1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[project.scripts]
product-os = "product_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

